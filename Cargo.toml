[package]
name = "seeded_archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
default-run = "seeded_archive"

[dependencies]
askama = "0.14.0"
axum = "0.8.4"
blake2 = "=0.10.6"
bs58 = { version = "=0.5.1", features = ["check"] }
bytes = "1"
cid = "0.11"
ed25519-dalek = "=2.2.0"
flate2 = "1"
getrandom = "=0.3.4"
hex = "0.4.3"
http-body = "1"
httpdate = "1"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
percent-encoding = "2.3.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha3 = "0.11"
subtle = "=2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.44", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "proxy_fixture"
path = "tests/support/proxy_fixture.rs"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
