{% import "macros.html" as ui %}
<ul class="person-list" data-load-more-region="{{ load_more_region }}">{% for entry in people %}<li><a{% if !entry.url.is_empty() %} href="{{ entry.url }}"{% endif %}>{% call ui::avatar(entry.avatar, entry.initial, 46) %}<span class="person-list-text"><span class="person-list-name">{{ entry.name }}</span>{% if !entry.address.is_empty() %}<code>{{ entry.address }}</code>{% endif %}<span class="person-list-detail">{{ entry.detail }}{% if !entry.url.is_empty() %} <span aria-hidden="true">→</span>{% endif %}</span></span></a></li>{% endfor %}</ul>
