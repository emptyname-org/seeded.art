<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ meta.title }} | seeded.art</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/site.css">
  <script type="module" src="/static/auth.js"></script>
  <script type="module" src="/static/load_more.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="/">seeded.art</a>
      {% include "search_form.html" %}
    <nav class="primary-nav" aria-label="Primary">
      <a href="/" {% if meta.active == "projects" %}aria-current="page" class="active"{% endif %}>Projects</a>
      <a href="/articles" {% if meta.active == "articles" %}aria-current="page" class="active"{% endif %}>Articles</a>
      <a href="/artists" {% if meta.active == "artists" %}aria-current="page" class="active"{% endif %}>Artists</a>
    </nav>
    <div class="account-access">
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme" title="Switch to dark theme"><svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <details class="account-menu" data-auth-connected data-auth-menu hidden>
        <summary class="connect-wallet" data-auth-address></summary>
        <div class="account-menu-items">
          <a href="/auth" data-auth-profile>Profile</a>
          <button type="button" data-auth-logout>Sign out</button>
        </div>
      </details>
      {% block account_link %}<a href="/auth" class="connect-wallet" data-auth-link>Connect wallet</a>{% endblock %}
    </div>
  </header>
  <main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <a class="wordmark" href="/">seeded.art</a>
    <a class="footer-forum" href="https://forum.seeded.art/">Forum</a>
    <a href="/about">About</a>
  </footer>
</body>
</html>
