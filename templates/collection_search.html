<form class="collection-search" action="{{ search.action }}" method="get" role="search" aria-label="{{ search.aria_label }}">{% if !search.view.is_empty() %}<input type="hidden" name="view" value="{{ search.view }}">{% endif %}<label for="{{ search.id }}-query">{{ search.label }}<input id="{{ search.id }}-query" type="search" name="q" value="{{ search.query }}" maxlength="200" placeholder="{{ search.placeholder }}"></label>{% if search.traits %}<details class="trait-filters" {% if !search.trait_name.is_empty() || !search.trait_value.is_empty() %}open{% endif %}><summary>Traits</summary><div class="trait-filter-inputs"><label for="{{ search.id }}-trait">Trait name<input id="{{ search.id }}-trait" name="trait_name" value="{{ search.trait_name }}" maxlength="200"></label><label for="{{ search.id }}-value">Trait value<input id="{{ search.id }}-value" name="trait_value" value="{{ search.trait_value }}" maxlength="200"></label></div></details>{% endif %}<button type="submit">Search</button>{% if search.filtered %}<a class="reset-link" href="{{ search.clear_url }}">Clear filters</a>{% endif %}</form>
